<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EGO | Secure Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <a href="index.html" class="logo">EGO</a>
        <div class="user-actions">
            <a href="index.html" class="cart-btn">Shop Archives</a>
        </div>
    </header>

    <main class="container">
        <div class="cart-container">
            <h1 class="cart-title">Your Archive</h1>
            
            <div id="cartList">
                </div>

            <div id="cartSummary" class="cart-summary-wrapper" style="display: none;">
                <div class="promo-section">
                    <input type="text" id="promoInput" class="promo-input" placeholder="ENTER PROMO CODE">
                    <button class="promo-btn" onclick="applyPromo()">Apply</button>
                </div>
                <div id="promoMsg" class="promo-msg"></div>

                <div class="cart-summary">
                    <div class="total-label">Subtotal:</div>
                    <div class="total-price" id="totalDisplay">$0.00</div>
                </div>
                <a href="https://members.ogads.com/" class="buy-now-btn" style="width: 100%; margin-top: 20px;">Execute Purchase</a>
            </div>
            
            <div id="emptyCart" class="empty-msg" style="text-align: center; padding: 60px; color: #555;">
                ARCIVE EMPTY_ <br><br>
                <a href="index.html" style="color: var(--accent); font-weight: bold; text-transform: uppercase;">Aquire Items</a>
            </div>
        </div>
    </main>

    <script>
        // متغير عالمي لحفظ قيمة الخصم
        let discountApplied = false;

        async function loadCart() {
            const cartIds = JSON.parse(localStorage.getItem('ego_cart')) || [];
            const cartList = document.getElementById('cartList');
            const summary = document.getElementById('cartSummary');
            const empty = document.getElementById('emptyCart');
            const totalDisplay = document.getElementById('totalDisplay');

            if (cartIds.length === 0) {
                empty.style.display = 'block';
                summary.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            summary.style.display = 'block';

            const response = await fetch('products.json');
            const allProducts = await response.json();

            let total = 0;
            cartList.innerHTML = '';

            cartIds.forEach((id, index) => {
                const product = allProducts.find(p => p.id === id);
                if (product) {
                    const priceNum = parseFloat(product.price.replace('$', ''));
                    total += priceNum;

                    cartList.innerHTML += `
                        <div class="cart-item">
                            <img src="${product.image}" alt="${product.name}">
                            <div class="cart-item-info">
                                <div class="cart-item-title">${product.name}</div>
                                <div class="cart-item-price">${product.price}</div>
                                <button class="remove-btn" onclick="removeItem(${index})">[ Remove ]</button>
                            </div>
                        </div>
                    `;
                }
            });

            // تطبيق الخصم إذا كان مفعلاً
            if (discountApplied) {
                total = 0; // تصفير السعر كلياً!
            }

            totalDisplay.innerText = `$${total.toFixed(2)}`;
        }

        // دالة تطبيق كود الخصم الجديد
        function applyPromo() {
            const code = document.getElementById('promoInput').value.toUpperCase().trim();
            const msg = document.getElementById('promoMsg');

            // كود الخصم السحري الخاص بك
            if (code === 'GET10') {
                discountApplied = true;
                msg.innerText = "SECURITY OVERRIDE_ CODE ACCEPTED. TOTAL RESET TO $0.";
                msg.style.color = "var(--matrix, #0f0)"; // أخضر مصفوفي للنجاح
                loadCart(); // إعادة تحميل السلة لتحديث السعر
            } else {
                discountApplied = false;
                msg.innerText = "INVALID CODE_ ACCESS DENIED.";
                msg.style.color = "var(--accent)";
                loadCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('ego_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('ego_cart', JSON.stringify(cart));
            loadCart();
        }

        loadCart();
    </script>
</body>
</html>

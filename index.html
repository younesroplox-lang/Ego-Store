<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGO | WORLDWIDE ARCHIVES</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-light: #ffffff;
            --text-dim: #999999;
            --accent: #d90429; /* أحمر دموي قوي */
            --card-bg: #0f0f0f;
            --border: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-light); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        /* شريط متحرك احترافي */
        .marquee { background: var(--text-light); color: var(--bg-color); padding: 8px 0; overflow: hidden; white-space: nowrap; font-weight: 900; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        .marquee-content { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* شريط التنقل الزجاجي */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; position: sticky; top: 0; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 100; }
        .logo { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        
        .search-container { position: relative; }
        .search-container input { background: transparent; border: none; border-bottom: 2px solid var(--text-dim); color: var(--text-light); padding: 8px 30px 8px 5px; font-size: 14px; outline: none; transition: 0.3s; width: 200px; font-family: 'Inter', sans-serif;}
        .search-container input:focus { border-color: var(--text-light); width: 250px; }

        /* الفلاتر */
        .filters { display: flex; gap: 15px; padding: 30px 5%; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 10px 25px; border-radius: 30px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .filter-btn:hover, .filter-btn.active { background: var(--text-light); color: var(--bg-color); border-color: var(--text-light); transform: translateY(-2px); }

        /* شبكة المنتجات */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 0 5% 60px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); cursor: pointer; overflow: hidden; position: relative; transition: border-color 0.3s; }
        .product-card:hover { border-color: #555; }
        
        .img-wrapper { width: 100%; aspect-ratio: 3/4; overflow: hidden; background: #111; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .product-card:hover img { transform: scale(1.08); }
        
        .product-info { padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        .product-title { font-size: 14px; font-weight: 600; text-transform: uppercase; width: 75%; line-height: 1.4; color: #ddd; }
        .product-price { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--accent); font-weight: 700; }

        /* شاشة المنتج (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 900px; height: 85vh; display: flex; border: 1px solid var(--border); position: relative; transform: translateY(20px); transition: transform 0.3s; overflow: hidden; }
        .modal.active .modal-content { transform: translateY(0); }
        
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 28px; color: #fff; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; z-index: 10; transition: 0.3s; }
        .close-btn:hover { background: var(--text-light); color: var(--bg-color); }

        .m-img-container { width: 50%; height: 100%; background: #111; }
        .m-img { width: 100%; height: 100%; object-fit: cover; }
        
        .m-details { width: 50%; padding: 50px; display: flex; flex-direction: column; overflow-y: auto; }
        .m-title { font-family: 'Oswald', sans-serif; font-size: 32px; text-transform: uppercase; margin-bottom: 10px; line-height: 1.1; }
        .m-price { font-size: 24px; color: var(--accent); font-weight: 900; margin-bottom: 30px; font-family: 'Oswald', sans-serif; }
        .m-desc { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin-bottom: 40px; }
        
        .size-label { font-size: 11px; color: #666; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .sizes-container { display: flex; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
        .size-box { border: 1px solid var(--border); padding: 12px 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--text-dim); }
        .size-box:hover { border-color: var(--text-light); color: var(--text-light); }

        .buy-btn { background: var(--text-light); color: var(--bg-color); padding: 20px; text-align: center; text-decoration: none; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-size: 16px; transition: 0.3s; border: none; cursor: pointer; width: 100%; display: block; }
        .buy-btn:hover { background: var(--accent); color: white; }

        .loading { text-align: center; padding: 50px; color: var(--text-dim); font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: 2px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* استجابة الهواتف */
        @media (max-width: 768px) {
            header { padding: 15px 5%; }
            .logo { font-size: 28px; }
            .search-container input { width: 150px; }
            .search-container input:focus { width: 180px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 5% 40px; }
            .product-info { padding: 12px; flex-direction: column; }
            .product-title { font-size: 12px; width: 100%; margin-bottom: 5px; }
            .product-price { font-size: 16px; }
            
            .modal-content { flex-direction: column; height: 95vh; top: auto; bottom: 0; transform: translateY(100%); border-radius: 20px 20px 0 0; }
            .modal.active .modal-content { transform: translateY(0); }
            .m-img-container { width: 100%; height: 40%; }
            .m-details { width: 100%; height: 60%; padding: 25px; }
            .m-title { font-size: 24px; }
            .close-btn { top: 10px; right: 10px; width: 35px; height: 35px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="marquee">
        <div class="marquee-content">
            EGO WORLDWIDE // PREMIUM ARCHIVES // WORLDWIDE SHIPPING // NEW COLLECTION DROP // EGO WORLDWIDE // PREMIUM ARCHIVES // WORLDWIDE SHIPPING // NEW COLLECTION DROP
        </div>
    </div>

    <header>
        <div class="logo">EGO</div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search archives..." onkeyup="handleSearch()">
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('all', this)">All Archives</button>
        <button class="filter-btn" onclick="filterCat('hoodies', this)">Hoodies</button>
        <button class="filter-btn" onclick="filterCat('tees', this)">Tees</button>
        <button class="filter-btn" onclick="filterCat('bottoms', this)">Bottoms</button>
    </div>

    <div id="loading" class="loading">SYNCING DATA...</div>
    
    <div class="grid" id="productGrid"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="m-img-container">
                <img src="" class="m-img" id="mImg">
            </div>
            <div class="m-details">
                <div class="m-title" id="mTitle">Product Name</div>
                <div class="m-price" id="mPrice">$0.00</div>
                <div class="m-desc" id="mDesc">Description goes here.</div>
                
                <div class="size-label">Select Size</div>
                <div class="sizes-container" id="mSizes"></div>
                
                <a href="https://members.ogads.com/" class="buy-btn" target="_blank">Aquire Item</a>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        const grid = document.getElementById('productGrid');
        const loader = document.getElementById('loading');

        fetch('products.json')
            .then(res => res.json())
            .then(data => {
                allProducts = data;
                loader.style.display = 'none';
                renderProducts(allProducts);
            })
            .catch(err => {
                loader.innerText = 'ERROR: FAILED TO SYNC DATABASE.';
            });

        function renderProducts(products) {
            grid.innerHTML = '';
            if(products.length === 0) {
                grid.innerHTML = '<div style="color:var(--text-dim); grid-column: 1/-1; text-align:center; padding: 40px;">No items match your search.</div>';
                return;
            }
            products.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <div class="img-wrapper"><img src="${item.image}" alt="${item.name}" loading="lazy"></div>
                    <div class="product-info">
                        <div class="product-title">${item.name}</div>
                        <div class="product-price">${item.price}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCat(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            if(category === 'all') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === category));
        }

        function handleSearch() {
            const query = document.getElementById('search').value.toLowerCase();
            renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(query) || p.category.includes(query)));
        }

        function openModal(item) {
            document.getElementById('mImg').src = item.image;
            document.getElementById('mTitle').innerText = item.name;
            document.getElementById('mPrice').innerText = item.price;
            document.getElementById('mDesc').innerText = item.description;
            
            const sizesDiv = document.getElementById('mSizes');
            sizesDiv.innerHTML = '';
            if(item.sizes && item.sizes.length > 0) {
                item.sizes.forEach(size => {
                    sizesDiv.innerHTML += `<div class="size-box">${size}</div>`;
                });
            } else {
                sizesDiv.innerHTML = `<div class="size-box" style="border-color:transparent; padding-left:0;">One Size</div>`;
            }

            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            // Slight delay to trigger the CSS transition
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 300); // Wait for transition to finish
        }
    </script>
</body>
</html><!--  -->

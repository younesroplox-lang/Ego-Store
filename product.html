<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGO | Product</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span>Simple and trusted product view</span>
      <span>Fast support</span>
      <span>Mobile friendly experience</span>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">EGO</a>

      <div></div>

      <div class="header-actions">
        <a href="index.html" class="secondary-btn">Back to shop</a>
        <a href="cart.html" class="cart-link">
          Cart
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-section">
    <div class="container">
      <div class="breadcrumbs">Home / Product</div>

      <section id="productContainer">
        <div class="product-layout">
          <p>Loading product...</p>
        </div>
      </section>

      <section class="related-section">
        <h2>You may also like</h2>
        <div class="grid" id="relatedGrid"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const productContainer = document.getElementById("productContainer");
    const relatedGrid = document.getElementById("relatedGrid");
    const cartCount = document.getElementById("cartCount");
    const toast = document.getElementById("toast");
    let selectedSize = "";

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function getCart() {
      return JSON.parse(localStorage.getItem("ego_cart")) || [];
    }

    function setCart(cart) {
      localStorage.setItem("ego_cart", JSON.stringify(cart));
    }

    function updateCartCount() {
      cartCount.textContent = getCart().length;
    }

    function selectSize(size, btn) {
      selectedSize = size;
      document.querySelectorAll(".size-btn").forEach((item) => {
        item.classList.remove("active");
      });
      btn.classList.add("active");
    }

    function addToCart(id) {
      const cart = getCart();
      cart.push(id);
      setCart(cart);
      updateCartCount();
      showToast(selectedSize ? "Added to cart" : "Added to cart");
    }

    async function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get("id");

      try {
        const response = await fetch("products.json");
        const products = await response.json();
        const product = products.find((item) => item.id === productId);

        if (!product) {
          productContainer.innerHTML = `
            <div class="empty-state">
              <h3>Product not found</h3>
              <p>The requested item could not be found.</p>
            </div>
          `;
          return;
        }

        productContainer.innerHTML = `
          <div class="product-layout">
            <div class="product-gallery">
              <img src="${product.image}" alt="${product.name}" />
            </div>

            <div class="product-details">
              <span class="eyebrow">${product.category}</span>
              <h1>${product.name}</h1>
              <div class="product-page-price">${product.price}</div>
              <p class="product-page-desc">${product.description}</p>

              <div class="detail-card">
                <div class="detail-label">Select size</div>
                <div class="size-list">
                  ${product.sizes.map(size => `
                    <button class="size-btn" onclick="selectSize('${size}', this)">${size}</button>
                  `).join("")}
                </div>
              </div>

              <div class="detail-card">
                <div class="detail-label">Why customers like it</div>
                <p class="product-page-desc" style="margin-bottom:0;">
                  Clean presentation, clear product details, and an easy path to checkout.
                </p>
              </div>

              <div class="product-page-actions">
                <button class="buy-btn" onclick="addToCart('${product.id}')">Add to cart</button>
                <a href="cart.html" class="view-btn">Go to cart</a>
              </div>
            </div>
          </div>
        `;

        const related = products
          .filter((item) => item.category === product.category && item.id !== product.id)
          .slice(0, 3);

        if (!related.length) {
          relatedGrid.innerHTML = `
            <div class="empty-state">
              <p>No related products found.</p>
            </div>
          `;
          return;
        }

        relatedGrid.innerHTML = related.map(item => `
          <article class="product-card">
            <a href="product.html?id=${item.id}" class="product-image-wrap">
              <span class="product-badge">Related</span>
              <img src="${item.image}" alt="${item.name}" />
            </a>
            <div class="product-info">
              <a href="product.html?id=${item.id}">
                <h3 class="product-title">${item.name}</h3>
              </a>
              <p class="product-desc">${item.description}</p>
              <div class="product-meta">
                <div class="product-price">${item.price}</div>
                <div class="product-category">${item.category}</div>
              </div>
              <div class="product-actions">
                <button class="add-btn" onclick="addToCart('${item.id}')">Add to cart</button>
                <a href="product.html?id=${item.id}" class="view-btn">View</a>
              </div>
            </div>
          </article>
        `).join("");

      } catch (error) {
        console.error(error);
        productContainer.innerHTML = `
          <div class="empty-state">
            <h3>Error loading product</h3>
            <p>Please check your products.json file.</p>
          </div>
        `;
      }
    }

    window.selectSize = selectSize;
    window.addToCart = addToCart;

    updateCartCount();
    loadProduct();
  </script>
</body>
</html>
